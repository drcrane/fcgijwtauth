<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />

<style>
:root {
	--bg: #ffffff;
	--text: #242424;
	--muted: #666666;
	--border: #d8d6d4;
	--button-bg: #ffffff;
	--button-text: #242424;
	--button-border: #d8d6d4;
	--button-shadow: rgba(0,0,0,.05);
	--button-hover-border: #a9a8a6;
	--button-hover-shadow: rgba(0,0,0,.08);
}

@media (prefers-color-scheme: dark) {
	:root {
		--bg: #1b1b1b;
		--text: #f3f3f3;
		--muted: #b8b8b8;
		--border: #444444;
		--button-bg: #2a2a2a;
		--button-text: #f3f3f3;
		--button-border: #555555;
		--button-shadow: rgba(0,0,0,.35);
		--button-hover-border: #777777;
		--button-hover-shadow: rgba(0,0,0,.5);
	}
}

@font-face {
	font-family: "Inter";
	font-weight: 100 900;
	font-style: normal;
	font-display: swap;
	src: url("Inter.var.latin.woff2") format("woff2-variations");
	unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

@font-face {
	font-family: "Inter";
	font-weight: 100 900;
	font-style: italic;
	font-display: swap;
	src: url("Inter.var.italic.latin.woff2") format("woff2-variations");
	unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}

* {
	box-sizing: border-box;
}

html,
body {
	height: 100%;
	margin: 0;
}

body {
	display: flex;
	justify-content: center;
	/* align-items: center; */
	/* padding: 2rem; */

	align-items: flex-start;
	padding: 3rem 2rem;

	font-family: Inter, sans-serif;
	letter-spacing: -0.015em;
	line-height: 1.5;

	background: var(--bg);
	color: var(--text);

	/* transition: background-color .2s ease, color .2s ease; */
}

button, input, optgroup, select, textarea {
	margin: 0;
	font: inherit;
}

.container {
	width: 100%;
	max-width: 480px;
	text-align: center;
}

h1 {
	margin: 0 0 .75rem;
	font-size: 2rem;
	font-weight: 600;
}

.subtitle {
	margin: 0 0 2rem;
	color: var(--muted);
}

button {
	display: inline-flex;
	align-items: center;
	justify-content: center;

	padding: .85rem 1.4rem;

	cursor: pointer;
	user-select: none;

	font-size: .95rem;
	font-weight: 500;

	color: var(--button-text);
	background: var(--button-bg);

	border: 1px solid var(--button-border);
	border-radius: 6px;

	box-shadow: 0 2px 4px var(--button-shadow);

	/* transition: background-color .2s, color .2s, border-color .2s, box-shadow .2s; */
}

button:hover {
	border-color: var(--button-hover-border);
	box-shadow: 0 4px 10px var(--button-hover-shadow);
}

button svg {
	margin-right: .75rem;
	flex-shrink: 0;
}

.notice {
	margin-top: 2rem;
	color: var(--muted);
	font-size: .95rem;
	line-height: 1.6;
}

.notice a {
	color: inherit;
}
</style>
</head>

<body>

<div class="container">

	<h1>Welcome to <% WELCOME_TO_COMPANY_NAME %></h1>

	<p class="subtitle">
		Sign in to <% APPLICATION_NAME %> using your Microsoft account.
	</p>

	<form method="POST" action="." enctype="application/x-www-form-urlencoded" id="loginMicrosoft">
		<input type="hidden" name="provider" value="microsoft">
		<input type="hidden" name="next_url" value="/welcome">

		<button name="submitbtn" type="submit">
			<svg width="17" height="17" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M0 0H7.57886V7.57886H0V0Z" fill="#F25022"/>
				<path d="M0 8.42114H7.57886V16H0V8.42114Z" fill="#00A4EF"/>
				<path d="M8.42114 0H16V7.57886H8.42114V0Z" fill="#7FBA00"/>
				<path d="M8.42114 8.42114H16V16H8.42114V8.42114Z" fill="#FFB900"/>
			</svg>
			Sign in with Microsoft
		</button>
	</form>

	<p class="notice">
		Please see our <strong><a href="<% PRIVACY_POLICY_URL %>">privacy notice</a></strong> for information about how your data is collected and used.
	</p>

</div>

</body>
</html>
