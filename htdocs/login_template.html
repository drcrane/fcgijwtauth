<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<title><% APPLICATION_NAME %></title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="res/authenticate_style.css" />
</head>

<body>

<div class="container">

	<img id="logo-dark" src="<% APPLICATION_APPLICATION_LOGO_DARK %>" alt="Logo" width="120" height="110" />
	<img id="logo-light" src="<% APPLICATION_APPLICATION_LOGO_LIGHT %>" alt="Logo" width="120" height="110" />

	<h1>Welcome to <% WELCOME_TO_COMPANY_NAME %></h1>

	<p class="subtitle">
		Sign in to <% APPLICATION_NAME %> using your Microsoft account.
	</p>

	<form method="POST" action="login" enctype="application/x-www-form-urlencoded" id="loginMicrosoft">
		<input type="hidden" name="provider" value="microsoft">
		<input type="hidden" name="next_url" value="<% REDIRECT_URL %>">
		<input type="hidden" name="redirect_to" value="<% REDIRECT_URL %>">

		<button name="submitbtn" type="submit">
			<svg width="17" height="17" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M0 0H7.57886V7.57886H0V0Z" fill="#F25022"/>
				<path d="M0 8.42114H7.57886V16H0V8.42114Z" fill="#00A4EF"/>
				<path d="M8.42114 0H16V7.57886H8.42114V0Z" fill="#7FBA00"/>
				<path d="M8.42114 8.42114H16V16H8.42114V8.42114Z" fill="#FFB900"/>
			</svg>
			Sign in with Microsoft
		</button>
	</form>

	<p class="notice">
		Need help sigining in? <strong><a href="help.html">Please click here</a></strong>.<br/>
		Please see our <strong><a href="<% PRIVACY_POLICY_URL %>">privacy notice</a></strong> for information about how your data is collected and used.
	</p>

</div>

</body>
</html>
